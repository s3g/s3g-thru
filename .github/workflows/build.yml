name: Build module

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install host validation tools
        run: sudo apt-get update && sudo apt-get install -y file
      - name: Install Move-compatible AArch64 toolchain
        env:
          TOOLCHAIN_URL: https://developer.arm.com/-/media/Files/downloads/gnu-a/10.3-2021.07/binrel/gcc-arm-10.3-2021.07-x86_64-aarch64-none-linux-gnu.tar.xz
          TOOLCHAIN_SHA256: 1e33d53dea59c8de823bbdfe0798280bdcd138636c7060da9d77a97ded095a84
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/arm-toolchain.tar.xz" "$TOOLCHAIN_URL"
          echo "$TOOLCHAIN_SHA256  $RUNNER_TEMP/arm-toolchain.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/arm-toolchain.tar.xz" -C "$RUNNER_TEMP"
      - name: Test
        run: npm test
      - name: Package
        env:
          AARCH64_CXX: ${{ runner.temp }}/gcc-arm-10.3-2021.07-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-g++
          AARCH64_STRIP: ${{ runner.temp }}/gcc-arm-10.3-2021.07-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-strip
          AARCH64_NM: ${{ runner.temp }}/gcc-arm-10.3-2021.07-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-nm
          AARCH64_READELF: ${{ runner.temp }}/gcc-arm-10.3-2021.07-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-readelf
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: s3g-thru-module
          path: dist/s3g-thru-module.tar.gz

