<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">s3g Thru audio signal flow</title>
  <desc id="desc">Block diagram showing microphone or line input and sample files entering four clip-local lanes, the eight-voice playback engine, lane gains, effects, stereo-linked program compression, output limiting, monitoring, and the resample return.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#202020"/></marker>
    <style>
      .box{fill:#fff;stroke:#202020;stroke-width:2}
      .soft{fill:#ececea;stroke:#202020;stroke-width:2}
      .group{fill:#f5f5f2;stroke:#777;stroke-width:1.4}
      .audio{fill:none;stroke:#202020;stroke-width:2;marker-end:url(#arrow)}
      .return{fill:none;stroke:#555;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#arrow)}
      .title{fill:#181818;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;text-anchor:middle}
      .sub{fill:#505050;font-family:Arial,Helvetica,sans-serif;font-size:12px;text-anchor:middle}
      .small{fill:#505050;font-family:Menlo,Monaco,monospace;font-size:11px;text-anchor:middle}
      .legend{fill:#333;font-family:Arial,Helvetica,sans-serif;font-size:12px}
    </style>
  </defs>
  <rect width="1200" height="520" fill="#fff"/>
  <text x="42" y="48" class="legend" font-weight="700">AUDIO PATH</text>
  <line x1="42" y1="63" x2="1158" y2="63" stroke="#202020" stroke-width="1.5"/>

  <!-- Draw connectors first so cell fills mask every route cleanly. Each
       segmented path finishes perpendicular to its destination edge. -->
  <g aria-hidden="true">
    <path d="M192 164H238" class="audio"/>
    <path d="M192 310H238" class="audio"/>
    <path d="M424 187H475" class="audio"/>
    <path d="M665 187H700" class="audio"/>
    <path d="M820 187H850" class="audio"/>
    <path d="M980 187H1010" class="audio"/>
    <path d="M1115 187H1140" class="audio"/>
    <path d="M192 187H215V390H570V371" class="audio"/>
    <path d="M665 333H1062V248" class="audio"/>
    <path d="M915 248V272H450V350H424" class="return"/>
  </g>

  <rect x="42" y="126" width="150" height="76" class="box"/>
  <text x="117" y="156" class="title">MOVE INPUT</text>
  <text x="117" y="179" class="sub">microphone / line</text>
  <rect x="42" y="272" width="150" height="76" class="box"/>
  <text x="117" y="302" class="title">SAMPLE FILE</text>
  <text x="117" y="325" class="sub">Move / Thru archive</text>

  <rect x="238" y="102" width="186" height="270" class="group"/>
  <text x="331" y="130" class="title">ACTIVE CLIP</text>
  <text x="331" y="151" class="sub">four source assignments</text>
  <rect x="267" y="174" width="128" height="34" class="box"/><text x="331" y="196" class="small">LANE 1 · STEREO</text>
  <rect x="267" y="219" width="128" height="34" class="box"/><text x="331" y="241" class="small">LANE 2 · STEREO</text>
  <rect x="267" y="264" width="128" height="34" class="box"/><text x="331" y="286" class="small">LANE 3 · STEREO</text>
  <rect x="267" y="309" width="128" height="34" class="box"/><text x="331" y="331" class="small">LANE 4 · STEREO</text>

  <rect x="475" y="126" width="190" height="122" class="soft"/>
  <text x="570" y="161" class="title">PLAYBACK · 8 VOICES</text>
  <text x="570" y="186" class="sub">Motion · Lanes · Grains</text>
  <text x="570" y="207" class="sub">Cutups · Sample · Slices</text>
  <text x="570" y="228" class="sub">Glitch · Weave · Wavesets</text>

  <rect x="700" y="126" width="120" height="122" class="box"/>
  <text x="760" y="161" class="title">LANE MIX</text>
  <text x="760" y="185" class="sub">four gains</text>
  <text x="760" y="207" class="sub">poly balance</text>

  <rect x="850" y="126" width="130" height="122" class="soft"/>
  <text x="915" y="155" class="title">EFFECTS</text>
  <text x="915" y="180" class="sub">tone · drive</text>
  <text x="915" y="201" class="sub">bits · rate · delay</text>
  <text x="915" y="222" class="sub">pan · rotary · tape</text>

  <rect x="1010" y="126" width="105" height="122" class="box"/>
  <text x="1062" y="155" class="title">SAFETY</text>
  <text x="1062" y="180" class="sub">program comp</text>
  <text x="1062" y="201" class="sub">lookahead limit</text>
  <text x="1062" y="222" class="sub">−1 dBFS ceiling</text>

  <rect x="1140" y="126" width="55" height="122" class="soft"/>
  <text x="1167" y="168" class="title">OUT</text>
  <text x="1167" y="192" class="sub">stereo</text>
  <text x="1167" y="213" class="sub">Move</text>

  <rect x="475" y="295" width="190" height="76" class="box"/>
  <text x="570" y="325" class="title">INPUT MONITOR</text>
  <text x="570" y="348" class="sub">dry · normally 0.00</text>

  <text x="665" y="443" class="small">RESAMPLE RETURN · PROCESSED OUTPUT TO SELECTED LANE</text>

  <line x1="42" y1="478" x2="88" y2="478" stroke="#202020" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="102" y="482" class="legend">audio</text>
  <line x1="178" y1="478" x2="224" y2="478" stroke="#555" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <text x="238" y="482" class="legend">resample write-back</text>
</svg>
