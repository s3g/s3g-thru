<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc"><title id="title">Layers stereo signal flow</title><desc id="desc">One engine feeds Dry, Filter, Blur and Delay independently; their outputs join at an XY mixer, then pass through output compression and limiting.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#292929"/></marker></defs><rect width="900" height="330" fill="white"/><g stroke="#292929" stroke-width="2" fill="none"><path d="M160 165H210M210 55V275M405 55H455M405 128H455M405 202H455M405 275H455M455 55V275"/><path d="M210 55H260" marker-end="url(#arrow)"/><path d="M210 128H260" marker-end="url(#arrow)"/><path d="M210 202H260" marker-end="url(#arrow)"/><path d="M210 275H260" marker-end="url(#arrow)"/><path d="M455 165H510" marker-end="url(#arrow)"/><path d="M620 165H690" marker-end="url(#arrow)"/></g><g fill="#f0f0ed" stroke="#292929" stroke-width="2"><rect x="20" y="133" width="140" height="64"/><rect x="260" y="31" width="145" height="48"/><rect x="260" y="104" width="145" height="48"/><rect x="260" y="178" width="145" height="48"/><rect x="260" y="251" width="145" height="48"/><rect x="510" y="133" width="110" height="64"/><rect x="690" y="133" width="185" height="64"/></g><g font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#151515"><text x="90" y="160">Engine voices</text><text x="90" y="182" font-size="13">Stereo bus</text><text x="332" y="61">Dry</text><text x="332" y="134">Filter</text><text x="332" y="208">Blur</text><text x="332" y="281">Delay</text><text x="565" y="171">XY mix</text><text x="782" y="159">Output compression</text><text x="782" y="182">and limiter</text></g></svg>