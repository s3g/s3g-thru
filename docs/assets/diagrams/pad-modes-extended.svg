<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="760" viewBox="0 0 1040 760" role="img" aria-labelledby="title desc">
<title id="title">s3g Thru Bank, Layers and Sequence pad layouts</title>
<desc id="desc">Bank divides the grid into sixteen A keyboard pads and sixteen numbered sample pads. Layers divides it into an A keyboard and a right-hand XY effects field with four corners. Sequence uses all thirty-two pads as steps of the selected track; Track buttons one through four choose its lane.</desc>
