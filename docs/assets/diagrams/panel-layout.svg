<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">s3g Thru control layout on Ableton Move</title>
  <desc id="desc">Simplified grayscale top-panel drawing with ten numbered callouts for the display, encoders, main wheel, track keys, pads, step keys, transport, Loop, navigation, and Shift and Delete controls.</desc>
  <defs>
    <style>
      .body{fill:#d8d8d5;stroke:#171717;stroke-width:2}
      .zone{fill:#ececea;stroke:#757572;stroke-width:1}
      .screen{fill:#292929;stroke:#111;stroke-width:2}
      .knob{fill:#f8f8f6;stroke:#171717;stroke-width:2}
      .key{fill:#f7f7f5;stroke:#3f3f3d;stroke-width:1.4}
      .pad{fill:#f5f5f2;stroke:#333;stroke-width:1.5}
      .step{fill:#f8f8f6;stroke:#333;stroke-width:1.2}
      .line{fill:none;stroke:#171717;stroke-width:1.5;stroke-linecap:square;stroke-linejoin:miter}
      .call{fill:#171717;stroke:#171717;stroke-width:1}
      .num{fill:#fff;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;text-anchor:middle;dominant-baseline:central}
      .label{fill:#242424;font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;letter-spacing:.6px}
      .tiny{fill:#555;font-family:Menlo,Monaco,monospace;font-size:10px;text-anchor:middle}
      .screenText{fill:#f4f4f1;font-family:Menlo,Monaco,monospace;font-size:12px}
    </style>
  </defs>
