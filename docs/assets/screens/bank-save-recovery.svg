<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 128 64" role="img" aria-labelledby="title desc">
  <title id="title">Failed Bank take: Retry Save, Keep Waiting or confirmed Discard</title>
  <desc id="desc">Failed Bank take: Retry Save, Keep Waiting or confirmed Discard shown as it appears on Ableton Move.</desc>
  <rect width="128" height="64" fill="#050706"/>
  <g shape-rendering="crispEdges" font-family="DejaVu Sans Mono, IBM Plex Mono, monospace" font-size="6" font-style="normal" font-weight="400" text-rendering="geometricPrecision">
    <text x="1" y="5.5" fill="#dce8e1">UNSAVED BANK TAKE</text>
    <rect x="0" y="8" width="128" height="1" fill="#dce8e1"/>
    <text x="1" y="16.5" fill="#dce8e1">PAD 01 IN MEMORY</text>
    <rect x="0" y="22" width="128" height="9" fill="#dce8e1"/>
    <text x="1" y="28.5" fill="#050706">RETRY SAVE</text>
    <text x="1" y="38.5" fill="#dce8e1">KEEP WAITING</text>
    <text x="1" y="48.5" fill="#dce8e1">DISCARD...</text>
    <text x="1" y="62.5" fill="#dce8e1">CLICK SET; BACK WAIT</text>
  </g>
  <rect x="0.25" y="0.25" width="127.5" height="63.5" fill="none" stroke="#5b6661" stroke-width="0.5"/>
</svg>
