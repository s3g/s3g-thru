<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 128 64" role="img" aria-labelledby="title desc">
  <title id="title">Capture lane rides and momentary effects</title>
  <desc id="desc">Capture lane rides and momentary effects shown as it appears on Ableton Move.</desc>
  <rect width="128" height="64" fill="#050706"/>
  <g shape-rendering="crispEdges" font-family="DejaVu Sans Mono, IBM Plex Mono, monospace" font-size="6" font-style="normal" font-weight="400" text-rendering="geometricPrecision">
    <text x="1" y="5.5" fill="#dce8e1">PERFORM BOTTOM 8</text>
    <rect x="0" y="8" width="128" height="1" fill="#dce8e1"/>
    <text x="2" y="16.5" fill="#dce8e1">L1</text>
    <text x="2" y="25.5" fill="#dce8e1">0%</text>
    <rect x="32" y="11" width="31" height="18" fill="#dce8e1"/>
    <text x="34" y="16.5" fill="#050706">L2</text>
    <text x="34" y="25.5" fill="#050706">100%</text>
    <text x="66" y="16.5" fill="#dce8e1">L3</text>
    <text x="66" y="25.5" fill="#dce8e1">0%</text>
    <text x="98" y="16.5" fill="#dce8e1">L4</text>
    <text x="98" y="25.5" fill="#dce8e1">0%</text>
    <rect x="0" y="32" width="31" height="18" fill="#dce8e1"/>
    <text x="2" y="37.5" fill="#050706">DARK</text>
    <text x="2" y="46.5" fill="#050706">80%</text>
    <text x="34" y="37.5" fill="#dce8e1">CRSH</text>
    <text x="34" y="46.5" fill="#dce8e1">0%</text>
    <text x="66" y="37.5" fill="#dce8e1">ECHO</text>
    <text x="66" y="46.5" fill="#dce8e1">0%</text>
    <text x="98" y="37.5" fill="#dce8e1">SPCE</text>
    <text x="98" y="46.5" fill="#dce8e1">0%</text>
    <text x="1" y="62.5" fill="#dce8e1">RELEASE TO RETURN</text>
  </g>
  <rect x="0.25" y="0.25" width="127.5" height="63.5" fill="none" stroke="#5b6661" stroke-width="0.5"/>
</svg>
