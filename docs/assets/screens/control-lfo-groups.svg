<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 128 64" role="img" aria-labelledby="title desc">
  <title id="title">LFO destinations grouped by their existing parameter pages</title>
  <desc id="desc">LFO destinations grouped by their existing parameter pages shown as it appears on Ableton Move.</desc>
  <rect width="128" height="64" fill="#050706"/>
  <g shape-rendering="crispEdges" font-family="DejaVu Sans Mono, IBM Plex Mono, monospace" font-size="6" font-style="normal" font-weight="400" text-rendering="geometricPrecision">
    <text x="1" y="5.5" fill="#dce8e1">DEST A</text>
    <text x="110" y="5.5" fill="#dce8e1">3/9</text>
    <text x="3" y="18.5" fill="#dce8e1">Off</text>
    <text x="3" y="28.5" fill="#dce8e1">ENGINE</text>
    <rect x="0" y="31" width="128" height="9" fill="#dce8e1"/>
    <text x="3" y="38.5" fill="#050706">GRAINS MAIN</text>
    <text x="3" y="48.5" fill="#dce8e1">GRAINS CLOUD</text>
    <text x="1" y="62.5" fill="#dce8e1">SELECT A PAGE</text>
  </g>
  <rect x="0.25" y="0.25" width="127.5" height="63.5" fill="none" stroke="#5b6661" stroke-width="0.5"/>
</svg>
