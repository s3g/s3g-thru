<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 128 64" role="img" aria-labelledby="title desc">
  <title id="title">Control LFO engine filter, phase, smoothing, offset and clip ownership</title>
  <desc id="desc">Control LFO engine filter, phase, smoothing, offset and clip ownership shown as it appears on Ableton Move.</desc>
  <rect width="128" height="64" fill="#050706"/>
  <g shape-rendering="crispEdges" font-family="DejaVu Sans Mono, IBM Plex Mono, monospace" font-size="6" font-style="normal" font-weight="400" text-rendering="geometricPrecision">
    <text x="1" y="5.5" fill="#dce8e1">LFO SETUP</text>
    <text x="110" y="5.5" fill="#dce8e1">9/9</text>
    <rect x="0" y="8" width="128" height="1" fill="#dce8e1"/>
    <text x="3" y="16.5" fill="#dce8e1">LFO</text>
    <text x="3" y="27.5" fill="#dce8e1">3/8</text>
    <text x="35" y="16.5" fill="#dce8e1">ENG</text>
    <text x="35" y="27.5" fill="#dce8e1">ANY</text>
    <text x="67" y="16.5" fill="#dce8e1">PHAS</text>
    <text x="67" y="27.5" fill="#dce8e1">25%</text>
    <text x="99" y="16.5" fill="#dce8e1">SMTH</text>
    <text x="99" y="27.5" fill="#dce8e1">20</text>
    <text x="3" y="40.5" fill="#dce8e1">FLOW</text>
    <text x="3" y="51.5" fill="#dce8e1">CLIP</text>
    <text x="35" y="40.5" fill="#dce8e1">OFST</text>
    <text x="35" y="51.5" fill="#dce8e1">AUTO</text>
    <rect x="78" y="42" width="4" height="4" fill="#dce8e1"/>
    <rect x="79" y="43" width="2" height="2" fill="#050706"/>
    <rect x="110" y="42" width="4" height="4" fill="#dce8e1"/>
    <rect x="111" y="43" width="2" height="2" fill="#050706"/>
    <text x="1" y="62.5" fill="#dce8e1">CLIP / LIVE FLOW</text>
  </g>
  <rect x="0.25" y="0.25" width="127.5" height="63.5" fill="none" stroke="#5b6661" stroke-width="0.5"/>
</svg>
