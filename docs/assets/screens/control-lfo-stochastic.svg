<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 128 64" role="img" aria-labelledby="title desc">
  <title id="title">Stochastic LFO targets including Source Group Size and Evolution Rate</title>
  <desc id="desc">Stochastic LFO targets including Source Group Size and Evolution Rate shown as it appears on Ableton Move.</desc>
  <rect width="128" height="64" fill="#050706"/>
  <g shape-rendering="crispEdges" font-family="DejaVu Sans Mono, IBM Plex Mono, monospace" font-size="6" font-style="normal" font-weight="400" text-rendering="geometricPrecision">
    <text x="1" y="5.5" fill="#dce8e1">STOCHASTIC</text>
    <text x="110" y="5.5" fill="#dce8e1">1/7</text>
    <rect x="0" y="11" width="128" height="9" fill="#dce8e1"/>
    <text x="3" y="18.5" fill="#050706">Source Group Size</text>
    <text x="3" y="28.5" fill="#dce8e1">Amplitude Deform</text>
    <text x="3" y="38.5" fill="#dce8e1">Timing Deform</text>
    <text x="3" y="48.5" fill="#dce8e1">Evolution Rate</text>
    <text x="1" y="62.5" fill="#dce8e1">CLICK: ASSIGN</text>
  </g>
  <rect x="0.25" y="0.25" width="127.5" height="63.5" fill="none" stroke="#5b6661" stroke-width="0.5"/>
</svg>
