<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 128 64" role="img" aria-labelledby="title desc">
  <title id="title">Assignable Control LFO with real Grain Size destination</title>
  <desc id="desc">Assignable Control LFO with real Grain Size destination shown as it appears on Ableton Move.</desc>
  <rect width="128" height="64" fill="#050706"/>
  <g shape-rendering="crispEdges" font-family="DejaVu Sans Mono, IBM Plex Mono, monospace" font-size="6" font-style="normal" font-weight="400" text-rendering="geometricPrecision">
    <text x="1" y="5.5" fill="#dce8e1">LFO</text>
    <text x="110" y="5.5" fill="#dce8e1">8/9</text>
    <rect x="0" y="8" width="128" height="1" fill="#dce8e1"/>
    <text x="3" y="16.5" fill="#dce8e1">LFO</text>
    <text x="3" y="27.5" fill="#dce8e1">3/8</text>
    <text x="35" y="16.5" fill="#dce8e1">PART</text>
    <text x="35" y="27.5" fill="#dce8e1">A</text>
    <text x="67" y="16.5" fill="#dce8e1">DEST</text>
    <text x="67" y="27.5" fill="#dce8e1">SIZE</text>
    <text x="99" y="16.5" fill="#dce8e1">DPTH</text>
    <text x="99" y="27.5" fill="#dce8e1">50</text>
    <text x="3" y="40.5" fill="#dce8e1">WAVE</text>
    <text x="3" y="51.5" fill="#dce8e1">SINE</text>
    <text x="35" y="40.5" fill="#dce8e1">CLCK</text>
    <text x="35" y="51.5" fill="#dce8e1">BEAT</text>
    <text x="67" y="40.5" fill="#dce8e1">RATE</text>
    <text x="67" y="51.5" fill="#dce8e1">1B</text>
    <text x="99" y="40.5" fill="#dce8e1">MODE</text>
    <text x="99" y="51.5" fill="#dce8e1">FREE</text>
    <text x="1" y="62.5" fill="#dce8e1">Grain Size</text>
  </g>
  <rect x="0.25" y="0.25" width="127.5" height="63.5" fill="none" stroke="#5b6661" stroke-width="0.5"/>
</svg>
