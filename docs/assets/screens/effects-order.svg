    <text x="1" y="22.5" fill="#dce8e1"> 2 Bits / Rate</text>
    <text x="1" y="30.5" fill="#dce8e1"> 3 Delay</text>
    <text x="1" y="38.5" fill="#dce8e1"> 4 Stereo / Rotary</text>
    <text x="1" y="46.5" fill="#dce8e1"> 5 Tape</text>
    <text x="1" y="54.5" fill="#dce8e1"> 6 Reverb</text>
