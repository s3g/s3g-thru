<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 128 64" role="img" aria-labelledby="title desc">
  <title id="title">FM HIT patch controls</title>
  <desc id="desc">FM HIT patch controls shown as it appears on Ableton Move.</desc>
  <rect width="128" height="64" fill="#050706"/>
  <g shape-rendering="crispEdges" font-family="DejaVu Sans Mono, IBM Plex Mono, monospace" font-size="6" font-style="normal" font-weight="400" text-rendering="geometricPrecision">
    <text x="1" y="5.5" fill="#dce8e1">FM HIT</text>
    <text x="110" y="5.5" fill="#dce8e1">8/9</text>
    <rect x="0" y="8" width="128" height="1" fill="#dce8e1"/>
    <text x="3" y="16.5" fill="#dce8e1">DEC</text>
    <text x="3" y="27.5" fill="#dce8e1">600</text>
    <text x="35" y="16.5" fill="#dce8e1">FDEC</text>
    <text x="35" y="27.5" fill="#dce8e1">120</text>
    <text x="67" y="16.5" fill="#dce8e1">BEND</text>
    <text x="67" y="27.5" fill="#dce8e1">24.0</text>
    <text x="99" y="16.5" fill="#dce8e1">TIME</text>
    <text x="99" y="27.5" fill="#dce8e1">25.0</text>
    <text x="3" y="40.5" fill="#dce8e1">HIT</text>
    <text x="3" y="51.5" fill="#dce8e1">20.0</text>
    <text x="35" y="40.5" fill="#dce8e1">NOIS</text>
    <text x="35" y="51.5" fill="#dce8e1">20.0</text>
    <text x="67" y="40.5" fill="#dce8e1">NDEC</text>
    <text x="67" y="51.5" fill="#dce8e1">70.0</text>
    <text x="99" y="40.5" fill="#dce8e1">HARD</text>
    <text x="99" y="51.5" fill="#dce8e1">60.0</text>
    <text x="1" y="62.5" fill="#dce8e1">L2 CLICK: ACTIONS</text>
  </g>
  <rect x="0.25" y="0.25" width="127.5" height="63.5" fill="none" stroke="#5b6661" stroke-width="0.5"/>
