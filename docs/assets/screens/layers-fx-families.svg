<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 128 64" role="img" aria-labelledby="title desc">
  <title id="title">Layers grouped effect families</title>
  <desc id="desc">Layers grouped effect families shown as it appears on Ableton Move.</desc>
  <rect width="128" height="64" fill="#050706"/>
  <g shape-rendering="crispEdges" font-family="DejaVu Sans Mono, IBM Plex Mono, monospace" font-size="6" font-style="normal" font-weight="400" text-rendering="geometricPrecision">
    <text x="1" y="5.5" fill="#dce8e1">C3 FX FAMILY</text>
    <text x="110" y="5.5" fill="#dce8e1">6/6</text>
    <rect x="0" y="8" width="128" height="1" fill="#dce8e1"/>
    <text x="2" y="17.5" fill="#dce8e1">Tone / Color</text>
    <text x="2" y="26.5" fill="#dce8e1">Pitch / Motion</text>
    <text x="2" y="35.5" fill="#dce8e1">Space</text>
    <text x="2" y="44.5" fill="#dce8e1">Spectral</text>
    <rect x="0" y="47" width="128" height="8" fill="#dce8e1"/>
    <text x="2" y="53.5" fill="#050706">Rhythm / Buffer</text>
    <text x="1" y="61.5" fill="#dce8e1">OPEN / BACK</text>
  </g>
  <rect x="0.25" y="0.25" width="127.5" height="63.5" fill="none" stroke="#5b6661" stroke-width="0.5"/>
</svg>
