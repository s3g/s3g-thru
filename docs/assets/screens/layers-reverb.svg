<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 128 64" role="img" aria-labelledby="title desc">
  <title id="title">Independent reverb corner controls</title>
  <desc id="desc">Independent reverb corner controls shown as it appears on Ableton Move.</desc>
  <rect width="128" height="64" fill="#050706"/>
  <g shape-rendering="crispEdges" font-family="DejaVu Sans Mono, IBM Plex Mono, monospace" font-size="6" font-style="normal" font-weight="400" text-rendering="geometricPrecision">
    <text x="1" y="5.5" fill="#dce8e1">C3 FX CORNER</text>
    <text x="110" y="5.5" fill="#dce8e1">2/4</text>
    <rect x="0" y="8" width="128" height="1" fill="#dce8e1"/>
    <text x="3" y="18.5" fill="#dce8e1">FX</text>
    <text x="3" y="29.5" fill="#dce8e1">RVRB</text>
    <text x="35" y="18.5" fill="#dce8e1">TYPE</text>
    <text x="35" y="29.5" fill="#dce8e1">PLATE</text>
    <text x="67" y="18.5" fill="#dce8e1">DCAY</text>
    <text x="67" y="29.5" fill="#dce8e1">2.0s</text>
    <text x="99" y="18.5" fill="#dce8e1">DAMP</text>
    <text x="99" y="29.5" fill="#dce8e1">5.9k</text>
    <text x="3" y="44.5" fill="#dce8e1">PRE</text>
    <text x="3" y="55.5" fill="#dce8e1">20ms</text>
    <text x="35" y="44.5" fill="#dce8e1">Z TO</text>
    <text x="35" y="55.5" fill="#dce8e1">OFF</text>
    <text x="67" y="44.5" fill="#dce8e1">ZAMT</text>
    <text x="67" y="55.5" fill="#dce8e1">0%</text>
    <text x="99" y="44.5" fill="#dce8e1">LVL</text>
    <text x="99" y="55.5" fill="#dce8e1">100%</text>
  </g>
  <rect x="0.25" y="0.25" width="127.5" height="63.5" fill="none" stroke="#5b6661" stroke-width="0.5"/>
</svg>
