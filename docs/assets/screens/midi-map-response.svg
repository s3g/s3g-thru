<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 128 64" role="img" aria-labelledby="title desc">
  <title id="title">Custom mapping Response: range, reverse and pickup</title>
  <desc id="desc">Custom mapping Response: range, reverse and pickup shown as it appears on Ableton Move.</desc>
  <rect width="128" height="64" fill="#050706"/>
  <g shape-rendering="crispEdges" font-family="DejaVu Sans Mono, IBM Plex Mono, monospace" font-size="6" font-style="normal" font-weight="400" text-rendering="geometricPrecision">
    <text x="1" y="5.5" fill="#dce8e1">MAP 1 RESPONSE</text>
    <text x="110" y="5.5" fill="#dce8e1">3/3</text>
    <rect x="0" y="8" width="128" height="1" fill="#dce8e1"/>
    <text x="1" y="16.5" fill="#dce8e1">MIN</text>
    <text x="1" y="26.5" fill="#dce8e1">10%</text>
    <text x="33" y="16.5" fill="#dce8e1">MAX</text>
    <text x="33" y="26.5" fill="#dce8e1">90%</text>
    <text x="65" y="16.5" fill="#dce8e1">REV</text>
    <text x="65" y="26.5" fill="#dce8e1">OFF</text>
    <text x="97" y="16.5" fill="#dce8e1">TAKE</text>
    <text x="97" y="26.5" fill="#dce8e1">PICK</text>
    <rect x="14" y="41" width="4" height="4" fill="#dce8e1"/>
    <rect x="15" y="42" width="2" height="2" fill="#050706"/>
    <rect x="46" y="41" width="4" height="4" fill="#dce8e1"/>
    <rect x="47" y="42" width="2" height="2" fill="#050706"/>
    <rect x="78" y="41" width="4" height="4" fill="#dce8e1"/>
    <rect x="79" y="42" width="2" height="2" fill="#050706"/>
    <rect x="110" y="41" width="4" height="4" fill="#dce8e1"/>
    <rect x="111" y="42" width="2" height="2" fill="#050706"/>
    <text x="1" y="62.5" fill="#dce8e1">CLICK: SAVE MAPPING</text>
  </g>
  <rect x="0.25" y="0.25" width="127.5" height="63.5" fill="none" stroke="#5b6661" stroke-width="0.5"/>
</svg>
