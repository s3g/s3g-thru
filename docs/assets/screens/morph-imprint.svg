<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 128 64" role="img" aria-labelledby="title desc">
  <title id="title">Morph Imprint envelope transfer</title>
  <desc id="desc">Morph Imprint envelope transfer shown as it appears on Ableton Move.</desc>
  <rect width="128" height="64" fill="#050706"/>
  <g shape-rendering="crispEdges" font-family="DejaVu Sans Mono, IBM Plex Mono, monospace" font-size="6" font-style="normal" font-weight="400" text-rendering="geometricPrecision">
    <text x="1" y="5.5" fill="#dce8e1">MORPH 6/20</text>
    <rect x="0" y="8" width="128" height="1" fill="#dce8e1"/>
    <text x="3" y="18.5" fill="#dce8e1">IMPR</text>
    <text x="3" y="29.5" fill="#dce8e1">100</text>
    <rect x="46" y="20" width="4" height="4" fill="#dce8e1"/>
    <rect x="47" y="21" width="2" height="2" fill="#050706"/>
    <text x="67" y="18.5" fill="#dce8e1">OFST</text>
    <text x="67" y="29.5" fill="#dce8e1">0.00</text>
    <text x="99" y="18.5" fill="#dce8e1">BLUR</text>
    <text x="99" y="29.5" fill="#dce8e1">40.0</text>
    <text x="3" y="44.5" fill="#dce8e1">PIT</text>
    <text x="3" y="55.5" fill="#dce8e1">0.00</text>
    <text x="35" y="44.5" fill="#dce8e1">MODE</text>
    <text x="35" y="55.5" fill="#dce8e1">IMPR</text>
    <rect x="78" y="46" width="4" height="4" fill="#dce8e1"/>
    <rect x="79" y="47" width="2" height="2" fill="#050706"/>
    <text x="98" y="39.5" fill="#dce8e1">PAIR</text>
    <text x="98" y="51.5" fill="#dce8e1">1&gt;2</text>
  </g>
  <rect x="0.25" y="0.25" width="127.5" height="63.5" fill="none" stroke="#5b6661" stroke-width="0.5"/>
</svg>
