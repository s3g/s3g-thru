<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 128 64" role="img" aria-labelledby="title desc">
  <title id="title">Dual-mode output mixer with levels and balances</title>
  <desc id="desc">Dual-mode output mixer with levels and balances shown as it appears on Ableton Move.</desc>
  <rect width="128" height="64" fill="#050706"/>
  <g shape-rendering="crispEdges" font-family="DejaVu Sans Mono, IBM Plex Mono, monospace" font-size="6" font-style="normal" font-weight="400" text-rendering="geometricPrecision">
    <text x="1" y="5.5" fill="#dce8e1">MIXER</text>
    <text x="104" y="5.5" fill="#dce8e1">1/11</text>
    <rect x="0" y="8" width="128" height="1" fill="#dce8e1"/>
    <text x="3" y="18.5" fill="#dce8e1">LVLA</text>
    <text x="3" y="29.5" fill="#dce8e1">1.00</text>
    <text x="35" y="18.5" fill="#dce8e1">LVLB</text>
    <text x="35" y="29.5" fill="#dce8e1">0.85</text>
    <rect x="78" y="20" width="4" height="4" fill="#dce8e1"/>
    <rect x="79" y="21" width="2" height="2" fill="#050706"/>
    <rect x="110" y="20" width="4" height="4" fill="#dce8e1"/>
    <rect x="111" y="21" width="2" height="2" fill="#050706"/>
    <text x="3" y="44.5" fill="#dce8e1">PANA</text>
    <text x="3" y="55.5" fill="#dce8e1">L25</text>
    <text x="35" y="44.5" fill="#dce8e1">PANB</text>
    <text x="35" y="55.5" fill="#dce8e1">R25</text>
    <rect x="78" y="46" width="4" height="4" fill="#dce8e1"/>
    <rect x="79" y="47" width="2" height="2" fill="#050706"/>
    <rect x="110" y="46" width="4" height="4" fill="#dce8e1"/>
    <rect x="111" y="47" width="2" height="2" fill="#050706"/>
  </g>
  <rect x="0.25" y="0.25" width="127.5" height="63.5" fill="none" stroke="#5b6661" stroke-width="0.5"/>
</svg>
