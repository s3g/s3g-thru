<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 128 64" role="img" aria-labelledby="title desc">
  <title id="title">Reset page confirmation with Cancel selected</title>
  <desc id="desc">Reset page confirmation with Cancel selected shown as it appears on Ableton Move.</desc>
  <rect width="128" height="64" fill="#050706"/>
  <g shape-rendering="crispEdges" font-family="DejaVu Sans Mono, IBM Plex Mono, monospace" font-size="6" font-style="normal" font-weight="400" text-rendering="geometricPrecision">
    <text x="1" y="5.5" fill="#dce8e1">A L1 ACTIONS</text>
    <text x="110" y="5.5" fill="#dce8e1">1/2</text>
    <rect x="0" y="8" width="128" height="1" fill="#dce8e1"/>
    <text x="2" y="19.5" fill="#dce8e1">RESET THIS PAGE</text>
    <text x="2" y="31.5" fill="#dce8e1">Undo is available</text>
    <rect x="0" y="38" width="128" height="9" fill="#dce8e1"/>
    <text x="3" y="44.5" fill="#050706">CANCEL</text>
    <text x="3" y="54.5" fill="#dce8e1">APPLY</text>
    <text x="1" y="62.5" fill="#dce8e1">CLICK SELECT BACK</text>
  </g>
  <rect x="0.25" y="0.25" width="127.5" height="63.5" fill="none" stroke="#5b6661" stroke-width="0.5"/>
</svg>
