<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 128 64" role="img" aria-labelledby="title desc">
  <title id="title">Contextual actions for part A patch lane 1</title>
  <desc id="desc">Contextual actions for part A patch lane 1 shown as it appears on Ableton Move.</desc>
  <rect width="128" height="64" fill="#050706"/>
  <g shape-rendering="crispEdges" font-family="DejaVu Sans Mono, IBM Plex Mono, monospace" font-size="6" font-style="normal" font-weight="400" text-rendering="geometricPrecision">
    <text x="1" y="5.5" fill="#dce8e1">A L1 ACTIONS</text>
    <text x="110" y="5.5" fill="#dce8e1">1/4</text>
    <rect x="0" y="8" width="128" height="1" fill="#dce8e1"/>
    <rect x="0" y="12" width="128" height="9" fill="#dce8e1"/>
    <text x="3" y="18.5" fill="#050706">STARTING SOUNDS</text>
    <text x="3" y="28.5" fill="#dce8e1">COPY PATCH</text>
    <text x="3" y="38.5" fill="#dce8e1">PASTE PATCH</text>
