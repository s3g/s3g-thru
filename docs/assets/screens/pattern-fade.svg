<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 128 64" role="img" aria-labelledby="title desc">
  <title id="title">Pattern Fade held at a smooth midpoint</title>
  <desc id="desc">Pattern Fade held at a smooth midpoint shown as it appears on Ableton Move.</desc>
  <rect width="128" height="64" fill="#050706"/>
  <g shape-rendering="crispEdges" font-family="DejaVu Sans Mono, IBM Plex Mono, monospace" font-size="6" font-style="normal" font-weight="400" text-rendering="geometricPrecision">
    <text x="1" y="5.5" fill="#dce8e1">PATTERN FADE</text>
    <rect x="0" y="8" width="128" height="1" fill="#dce8e1"/>
    <text x="1" y="16.5" fill="#dce8e1">A01&gt;A02 H</text>
    <rect x="77" y="13" width="49" height="1" fill="#dce8e1"/>
    <rect x="101" y="11" width="2" height="5" fill="#dce8e1"/>
    <text x="1" y="26.5" fill="#dce8e1">TIME</text>
    <text x="1" y="36.5" fill="#dce8e1">30s</text>
    <text x="33" y="26.5" fill="#dce8e1">CURVE</text>
    <text x="33" y="36.5" fill="#dce8e1">SMTH</text>
    <text x="65" y="26.5" fill="#dce8e1">XFADE</text>
    <text x="65" y="36.5" fill="#dce8e1">50%</text>
    <text x="97" y="26.5" fill="#dce8e1">HOLD</text>
    <text x="97" y="36.5" fill="#dce8e1">ON</text>
    <rect x="14" y="52" width="4" height="4" fill="#dce8e1"/>
    <rect x="15" y="53" width="2" height="2" fill="#050706"/>
    <rect x="46" y="52" width="4" height="4" fill="#dce8e1"/>
    <rect x="47" y="53" width="2" height="2" fill="#050706"/>
    <text x="65" y="49.5" fill="#dce8e1">MODE</text>
    <text x="65" y="59.5" fill="#dce8e1">FIX</text>
    <text x="97" y="49.5" fill="#dce8e1">DONE</text>
    <text x="97" y="59.5" fill="#dce8e1">TURN</text>
  </g>
  <rect x="0.25" y="0.25" width="127.5" height="63.5" fill="none" stroke="#5b6661" stroke-width="0.5"/>
</svg>
