<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 128 64" role="img" aria-labelledby="title desc">
  <title id="title">Project export progress in megabytes</title>
  <desc id="desc">Project export progress in megabytes shown as it appears on Ableton Move.</desc>
  <rect width="128" height="64" fill="#050706"/>
  <g shape-rendering="crispEdges" font-family="DejaVu Sans Mono, IBM Plex Mono, monospace" font-size="6" font-style="normal" font-weight="400" text-rendering="geometricPrecision">
    <text x="1" y="5.5" fill="#dce8e1">THRU PROJECTS</text>
    <text x="128" y="5.5" fill="#dce8e1"></text>
    <rect x="0" y="8" width="128" height="1" fill="#dce8e1"/>
    <text x="1" y="19.5" fill="#dce8e1">EXPORTING PROJECT</text>
    <text x="1" y="33.5" fill="#dce8e1">50%  6.0 MB</text>
    <rect x="1" y="40" width="126" height="6" fill="#dce8e1"/>
    <rect x="2" y="41" width="124" height="4" fill="#050706"/>
    <rect x="2" y="41" width="62" height="4" fill="#dce8e1"/>
    <text x="1" y="62.5" fill="#dce8e1">BACK: CANCEL</text>
  </g>
  <rect x="0.25" y="0.25" width="127.5" height="63.5" fill="none" stroke="#5b6661" stroke-width="0.5"/>
</svg>
