    <text x="35" y="44.5" fill="#dce8e1">LOCKS</text>
    <text x="35" y="55.5" fill="#dce8e1">KEEP</text>
    <text x="67" y="44.5" fill="#dce8e1">PRINT</text>
    <text x="67" y="55.5" fill="#dce8e1">APPLY</text>
    <text x="99" y="44.5" fill="#dce8e1">REGEN</text>
    <text x="99" y="55.5" fill="#dce8e1">APPLY</text>
  </g>
  <rect x="0.25" y="0.25" width="127.5" height="63.5" fill="none" stroke="#5b6661" stroke-width="0.5"/>
</svg>
