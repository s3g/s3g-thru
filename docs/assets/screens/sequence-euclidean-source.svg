<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 128 64" role="img" aria-labelledby="title desc">
  <title id="title">EUC SOURCE controls for the selected sequence lane</title>
  <desc id="desc">EUC SOURCE controls for the selected sequence lane shown as it appears on Ableton Move.</desc>
  <rect width="128" height="64" fill="#050706"/>
  <g shape-rendering="crispEdges" font-family="DejaVu Sans Mono, IBM Plex Mono, monospace" font-size="6" font-style="normal" font-weight="400" text-rendering="geometricPrecision">
    <text x="1" y="5.5" fill="#dce8e1">L2 EUC SOURCE</text>
    <text x="104" y="5.5" fill="#dce8e1">4/13</text>
    <rect x="0" y="8" width="128" height="1" fill="#dce8e1"/>
    <text x="3" y="18.5" fill="#dce8e1">MAP</text>
    <text x="3" y="29.5" fill="#dce8e1">TRANS</text>
    <rect x="46" y="20" width="4" height="4" fill="#dce8e1"/>
    <rect x="47" y="21" width="2" height="2" fill="#050706"/>
    <text x="67" y="18.5" fill="#dce8e1">FROM</text>
    <text x="67" y="29.5" fill="#dce8e1">8%</text>
    <text x="99" y="18.5" fill="#dce8e1">TO</text>
    <text x="99" y="29.5" fill="#dce8e1">92%</text>
    <text x="3" y="44.5" fill="#dce8e1">PRER</text>
