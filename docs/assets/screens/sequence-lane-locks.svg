<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 128 64" role="img" aria-labelledby="title desc">
  <title id="title">Lane EQ locks change the shared lane bus</title>
  <desc id="desc">Lane EQ locks change the shared lane bus shown as it appears on Ableton Move.</desc>
  <rect width="128" height="64" fill="#050706"/>
  <g shape-rendering="crispEdges" font-family="DejaVu Sans Mono, IBM Plex Mono, monospace" font-size="6" font-style="normal" font-weight="400" text-rendering="geometricPrecision">
    <text x="1" y="5.5" fill="#dce8e1">T01 STRIP 1</text>
    <text x="110" y="5.5" fill="#dce8e1">2/5</text>
    <rect x="0" y="8" width="128" height="1" fill="#dce8e1"/>
    <text x="3" y="16.5" fill="#dce8e1">LOW</text>
    <text x="3" y="27.5" fill="#dce8e1">+3</text>
    <rect x="28" y="11" width="3" height="3" fill="#dce8e1"/>
    <rect x="29" y="12" width="1" height="1" fill="#050706"/>
    <text x="35" y="16.5" fill="#dce8e1">MID</text>
    <text x="35" y="27.5" fill="#dce8e1">-4.5</text>
    <rect x="60" y="11" width="3" height="3" fill="#dce8e1"/>
    <rect x="61" y="12" width="1" height="1" fill="#050706"/>
    <text x="67" y="16.5" fill="#dce8e1">HIGH</text>
    <text x="67" y="27.5" fill="#dce8e1">+2</text>
    <rect x="92" y="11" width="3" height="3" fill="#dce8e1"/>
    <rect x="93" y="12" width="1" height="1" fill="#050706"/>
    <text x="99" y="16.5" fill="#dce8e1">FREQ</text>
    <text x="99" y="27.5" fill="#dce8e1">1400</text>
    <rect x="124" y="11" width="3" height="3" fill="#dce8e1"/>
    <rect x="125" y="12" width="1" height="1" fill="#050706"/>
    <rect x="14" y="42" width="4" height="4" fill="#dce8e1"/>
    <rect x="15" y="43" width="2" height="2" fill="#050706"/>
    <rect x="46" y="42" width="4" height="4" fill="#dce8e1"/>
    <rect x="47" y="43" width="2" height="2" fill="#050706"/>
    <rect x="78" y="42" width="4" height="4" fill="#dce8e1"/>
    <rect x="79" y="43" width="2" height="2" fill="#050706"/>
    <rect x="110" y="42" width="4" height="4" fill="#dce8e1"/>
    <rect x="111" y="43" width="2" height="2" fill="#050706"/>
    <text x="1" y="62.5" fill="#dce8e1">LANE LOCKS</text>
  </g>
  <rect x="0.25" y="0.25" width="127.5" height="63.5" fill="none" stroke="#5b6661" stroke-width="0.5"/>
</svg>
