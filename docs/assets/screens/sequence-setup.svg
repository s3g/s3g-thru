    <text x="104" y="5.5" fill="#dce8e1">2/13</text>
    <rect x="0" y="8" width="128" height="1" fill="#dce8e1"/>
    <text x="3" y="18.5" fill="#dce8e1">ROOT</text>
    <text x="3" y="29.5" fill="#dce8e1">C4</text>
    <text x="35" y="18.5" fill="#dce8e1">SCAL</text>
