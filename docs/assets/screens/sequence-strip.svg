<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 128 64" role="img" aria-labelledby="title desc">
  <title id="title">Third sequence channel strip in the Mix/FX page group</title>
  <desc id="desc">Third sequence channel strip in the Mix/FX page group shown as it appears on Ableton Move.</desc>
  <rect width="128" height="64" fill="#050706"/>
  <g shape-rendering="crispEdges" font-family="DejaVu Sans Mono, IBM Plex Mono, monospace" font-size="6" font-style="normal" font-weight="400" text-rendering="geometricPrecision">
    <text x="1" y="5.5" fill="#dce8e1">SEQ STRIP 3</text>
    <text x="104" y="5.5" fill="#dce8e1">4/13</text>
    <rect x="0" y="8" width="128" height="1" fill="#dce8e1"/>
    <text x="3" y="18.5" fill="#dce8e1">LOW</text>
    <text x="3" y="29.5" fill="#dce8e1">+2.5</text>
    <text x="35" y="18.5" fill="#dce8e1">MID</text>
    <text x="35" y="29.5" fill="#dce8e1">-1.5</text>
    <text x="67" y="18.5" fill="#dce8e1">HIGH</text>
    <text x="67" y="29.5" fill="#dce8e1">0</text>
    <text x="99" y="18.5" fill="#dce8e1">FREQ</text>
    <text x="99" y="29.5" fill="#dce8e1">1800</text>
    <text x="3" y="44.5" fill="#dce8e1">SOLO</text>
    <text x="3" y="55.5" fill="#dce8e1">OFF</text>
    <rect x="46" y="46" width="4" height="4" fill="#dce8e1"/>
    <rect x="47" y="47" width="2" height="2" fill="#050706"/>
    <rect x="78" y="46" width="4" height="4" fill="#dce8e1"/>
    <rect x="79" y="47" width="2" height="2" fill="#050706"/>
    <rect x="110" y="46" width="4" height="4" fill="#dce8e1"/>
    <rect x="111" y="47" width="2" height="2" fill="#050706"/>
  </g>
  <rect x="0.25" y="0.25" width="127.5" height="63.5" fill="none" stroke="#5b6661" stroke-width="0.5"/>
</svg>
