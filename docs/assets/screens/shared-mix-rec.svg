<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 128 64" role="img" aria-labelledby="title desc">
  <title id="title">Shared Dual B lane gains and common recording controls</title>
  <desc id="desc">Shared Dual B lane gains and common recording controls shown as it appears on Ableton Move.</desc>
  <rect width="128" height="64" fill="#050706"/>
  <g shape-rendering="crispEdges" font-family="DejaVu Sans Mono, IBM Plex Mono, monospace" font-size="6" font-style="normal" font-weight="400" text-rendering="geometricPrecision">
    <text x="1" y="5.5" fill="#dce8e1">B MIX / REC 10/24</text>
    <rect x="0" y="8" width="128" height="1" fill="#dce8e1"/>
    <text x="3" y="18.5" fill="#dce8e1">L1</text>
    <text x="3" y="29.5" fill="#dce8e1">1.00</text>
    <text x="35" y="18.5" fill="#dce8e1">L2</text>
    <text x="35" y="29.5" fill="#dce8e1">1.00</text>
    <text x="67" y="18.5" fill="#dce8e1">L3</text>
    <text x="67" y="29.5" fill="#dce8e1">1.00</text>
    <text x="99" y="18.5" fill="#dce8e1">L4</text>
    <text x="99" y="29.5" fill="#dce8e1">1.00</text>
    <text x="3" y="44.5" fill="#dce8e1">SRC</text>
    <text x="3" y="55.5" fill="#dce8e1">IN</text>
    <text x="35" y="44.5" fill="#dce8e1">REC</text>
    <text x="35" y="55.5" fill="#dce8e1">1.00</text>
    <text x="67" y="44.5" fill="#dce8e1">MON</text>
    <text x="67" y="55.5" fill="#dce8e1">0.00</text>
    <text x="99" y="44.5" fill="#dce8e1">PREV</text>
    <text x="99" y="55.5" fill="#dce8e1">0.70</text>
  </g>
  <rect x="0.25" y="0.25" width="127.5" height="63.5" fill="none" stroke="#5b6661" stroke-width="0.5"/>
