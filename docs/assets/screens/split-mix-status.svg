<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 128 64" role="img" aria-labelledby="title desc">
  <title id="title">Split activity and muted B status</title>
  <desc id="desc">Split activity and muted B status shown as it appears on Ableton Move.</desc>
  <rect width="128" height="64" fill="#050706"/>
  <g shape-rendering="crispEdges" font-family="DejaVu Sans Mono, IBM Plex Mono, monospace" font-size="6" font-style="normal" font-weight="400" text-rendering="geometricPrecision">
    <text x="1" y="5.5" fill="#dce8e1">MIX STATUS EDIT A</text>
    <rect x="0" y="8" width="128" height="1" fill="#dce8e1"/>
    <text x="1" y="17.5" fill="#dce8e1">A SAMPLE 1/4</text>
    <rect x="1" y="22" width="43" height="6" fill="#dce8e1"/>
    <rect x="2" y="23" width="41" height="4" fill="#050706"/>
    <rect x="2" y="23" width="28" height="4" fill="#dce8e1"/>
    <text x="49" y="26.5" fill="#dce8e1">ACTIVE</text>
    <text x="1" y="38.5" fill="#dce8e1">B GRAINS 1/4</text>
    <rect x="1" y="43" width="43" height="6" fill="#dce8e1"/>
    <rect x="2" y="44" width="41" height="4" fill="#050706"/>
    <text x="49" y="47.5" fill="#dce8e1">MUTED</text>
    <text x="1" y="62.5" fill="#dce8e1">BLND 50% </text>
  </g>
  <rect x="0.25" y="0.25" width="127.5" height="63.5" fill="none" stroke="#5b6661" stroke-width="0.5"/>
</svg>
