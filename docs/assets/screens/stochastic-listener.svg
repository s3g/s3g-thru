<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 128 64" role="img" aria-labelledby="title desc">
  <title id="title">Stochastic listener capture with conditional CAPT knob</title>
  <desc id="desc">Stochastic listener capture with conditional CAPT knob shown as it appears on Ableton Move.</desc>
  <rect width="128" height="64" fill="#050706"/>
  <g shape-rendering="crispEdges" font-family="DejaVu Sans Mono, IBM Plex Mono, monospace" font-size="6" font-style="normal" font-weight="400" text-rendering="geometricPrecision">
    <text x="1" y="5.5" fill="#dce8e1">STOCHASTIC 7/21</text>
    <rect x="0" y="8" width="128" height="1" fill="#dce8e1"/>
    <text x="3" y="16.5" fill="#dce8e1">SIZE</text>
    <text x="3" y="27.5" fill="#dce8e1">2</text>
    <text x="35" y="16.5" fill="#dce8e1">AMUT</text>
    <text x="35" y="27.5" fill="#dce8e1">65%</text>
    <text x="67" y="16.5" fill="#dce8e1">TMUT</text>
    <text x="67" y="27.5" fill="#dce8e1">70%</text>
    <text x="99" y="16.5" fill="#dce8e1">EVOL</text>
    <text x="99" y="27.5" fill="#dce8e1">CYC</text>
    <text x="3" y="40.5" fill="#dce8e1">MEM</text>
    <text x="3" y="51.5" fill="#dce8e1">80%</text>
    <text x="35" y="40.5" fill="#dce8e1">CAPT</text>
    <text x="35" y="51.5" fill="#dce8e1">65%</text>
    <text x="67" y="40.5" fill="#dce8e1">LAW</text>
    <text x="67" y="51.5" fill="#dce8e1">LSTN</text>
    <text x="99" y="40.5" fill="#dce8e1">DRFT</text>
    <text x="99" y="51.5" fill="#dce8e1">0%</text>
    <text x="1" y="62.5" fill="#dce8e1">SRC HELD CLICK: RUN</text>
  </g>
  <rect x="0.25" y="0.25" width="127.5" height="63.5" fill="none" stroke="#5b6661" stroke-width="0.5"/>
</svg>
