<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 128 64" role="img" aria-labelledby="title desc">
  <title id="title">FM operator routing, ratios, indices, feedback, detune and mix</title>
  <desc id="desc">FM operator routing, ratios, indices, feedback, detune and mix shown as it appears on Ableton Move.</desc>
  <rect width="128" height="64" fill="#050706"/>
  <g shape-rendering="crispEdges" font-family="DejaVu Sans Mono, IBM Plex Mono, monospace" font-size="6" font-style="normal" font-weight="400" text-rendering="geometricPrecision">
    <text x="1" y="5.5" fill="#dce8e1">FM</text>
    <text x="110" y="5.5" fill="#dce8e1">2/2</text>
    <rect x="0" y="8" width="128" height="1" fill="#dce8e1"/>
    <text x="3" y="16.5" fill="#dce8e1">ALG</text>
    <text x="3" y="27.5" fill="#dce8e1">SER</text>
    <text x="35" y="16.5" fill="#dce8e1">RAT1</text>
    <text x="35" y="27.5" fill="#dce8e1">2</text>
    <text x="67" y="16.5" fill="#dce8e1">IDX1</text>
    <text x="67" y="27.5" fill="#dce8e1">3.5</text>
    <text x="99" y="16.5" fill="#dce8e1">RAT2</text>
    <text x="99" y="27.5" fill="#dce8e1">1.5</text>
    <text x="3" y="40.5" fill="#dce8e1">IDX2</text>
    <text x="3" y="51.5" fill="#dce8e1">2.2</text>
    <text x="35" y="40.5" fill="#dce8e1">FDBK</text>
    <text x="35" y="51.5" fill="#dce8e1">15%</text>
    <text x="67" y="40.5" fill="#dce8e1">DETN</text>
    <text x="67" y="51.5" fill="#dce8e1">8.0c</text>
    <text x="99" y="40.5" fill="#dce8e1">MIX</text>
    <text x="99" y="51.5" fill="#dce8e1">85%</text>
    <text x="1" y="62.5" fill="#dce8e1">READY</text>
  </g>
  <rect x="0.25" y="0.25" width="127.5" height="63.5" fill="none" stroke="#5b6661" stroke-width="0.5"/>
