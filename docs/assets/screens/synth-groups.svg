<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 128 64" role="img" aria-labelledby="title desc">
  <title id="title">Synth Sound, Motion, Output and Actions navigation</title>
  <desc id="desc">Synth Sound, Motion, Output and Actions navigation shown as it appears on Ableton Move.</desc>
  <rect width="128" height="64" fill="#050706"/>
  <g shape-rendering="crispEdges" font-family="DejaVu Sans Mono, IBM Plex Mono, monospace" font-size="6" font-style="normal" font-weight="400" text-rendering="geometricPrecision">
    <text x="1" y="5.5" fill="#dce8e1">SYNTH GROUPS</text>
    <text x="110" y="5.5" fill="#dce8e1">1/4</text>
    <rect x="0" y="8" width="128" height="1" fill="#dce8e1"/>
    <rect x="0" y="11" width="128" height="9" fill="#dce8e1"/>
    <text x="2" y="17.5" fill="#050706">SOUND</text>
    <text x="2" y="27.5" fill="#dce8e1">MOTION</text>
    <text x="2" y="37.5" fill="#dce8e1">OUTPUT</text>
    <text x="2" y="47.5" fill="#dce8e1">ACTIONS</text>
    <text x="1" y="62.5" fill="#dce8e1">CLICK SELECT  BACK</text>
  </g>
  <rect x="0.25" y="0.25" width="127.5" height="63.5" fill="none" stroke="#5b6661" stroke-width="0.5"/>
</svg>
