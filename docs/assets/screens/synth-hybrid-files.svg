<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 128 64" role="img" aria-labelledby="title desc">
  <title id="title">Four Hybrid source selections</title>
  <desc id="desc">Four Hybrid source selections shown as it appears on Ableton Move.</desc>
  <rect width="128" height="64" fill="#050706"/>
  <g shape-rendering="crispEdges" font-family="DejaVu Sans Mono, IBM Plex Mono, monospace" font-size="6" font-style="normal" font-weight="400" text-rendering="geometricPrecision">
    <text x="1" y="5.5" fill="#dce8e1">HYBRID FILES</text>
    <text x="110" y="5.5" fill="#dce8e1">2/4</text>
    <rect x="0" y="8" width="128" height="1" fill="#dce8e1"/>
    <text x="1" y="17.5" fill="#dce8e1">A</text>
    <text x="13" y="17.5" fill="#dce8e1">voice.wav</text>
    <text x="1" y="28.5" fill="#dce8e1">B</text>
    <text x="13" y="28.5" fill="#dce8e1">bell.wav</text>
    <text x="1" y="39.5" fill="#dce8e1">C</text>
    <text x="13" y="39.5" fill="#dce8e1">rain.wav</text>
    <text x="1" y="50.5" fill="#dce8e1">D</text>
    <text x="13" y="50.5" fill="#dce8e1">strings.wav</text>
    <text x="1" y="62.5" fill="#dce8e1">CLICK: PICK FILES</text>
  </g>
  <rect x="0.25" y="0.25" width="127.5" height="63.5" fill="none" stroke="#5b6661" stroke-width="0.5"/>
</svg>
