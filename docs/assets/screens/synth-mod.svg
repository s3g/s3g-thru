<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 128 64" role="img" aria-labelledby="title desc">
  <title id="title">Shared generator modulation and file loop controls</title>
  <desc id="desc">Shared generator modulation and file loop controls shown as it appears on Ableton Move.</desc>
  <rect width="128" height="64" fill="#050706"/>
  <g shape-rendering="crispEdges" font-family="DejaVu Sans Mono, IBM Plex Mono, monospace" font-size="6" font-style="normal" font-weight="400" text-rendering="geometricPrecision">
    <text x="1" y="5.5" fill="#dce8e1">SYNTH MOD</text>
    <text x="110" y="5.5" fill="#dce8e1">1/3</text>
    <rect x="0" y="8" width="128" height="1" fill="#dce8e1"/>
    <text x="3" y="16.5" fill="#dce8e1">LFO</text>
    <text x="3" y="27.5" fill="#dce8e1">TRI</text>
    <text x="35" y="16.5" fill="#dce8e1">CYCL</text>
    <text x="35" y="27.5" fill="#dce8e1">5cy</text>
    <text x="67" y="16.5" fill="#dce8e1">AMT</text>
    <text x="67" y="27.5" fill="#dce8e1">35%</text>
    <text x="99" y="16.5" fill="#dce8e1">DEST</text>
    <text x="99" y="27.5" fill="#dce8e1">EVOL</text>
    <text x="3" y="40.5" fill="#dce8e1">FADE</text>
    <text x="3" y="51.5" fill="#dce8e1">150ms</text>
    <text x="35" y="40.5" fill="#dce8e1">PHAS</text>
    <text x="35" y="51.5" fill="#dce8e1">90d</text>
    <text x="67" y="40.5" fill="#dce8e1">FIT</text>
    <text x="67" y="51.5" fill="#dce8e1">FILE</text>
    <text x="99" y="40.5" fill="#dce8e1">LOOP</text>
    <text x="99" y="51.5" fill="#dce8e1">OFF</text>
    <text x="1" y="62.5" fill="#dce8e1">READY</text>
  </g>
  <rect x="0.25" y="0.25" width="127.5" height="63.5" fill="none" stroke="#5b6661" stroke-width="0.5"/>
</svg>
