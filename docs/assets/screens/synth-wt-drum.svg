<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 128 64" role="img" aria-labelledby="title desc">
  <title id="title">Wavetable drum starting model body scan and attack</title>
  <desc id="desc">Wavetable drum starting model body scan and attack shown as it appears on Ableton Move.</desc>
  <rect width="128" height="64" fill="#050706"/>
  <g shape-rendering="crispEdges" font-family="DejaVu Sans Mono, IBM Plex Mono, monospace" font-size="6" font-style="normal" font-weight="400" text-rendering="geometricPrecision">
    <text x="1" y="5.5" fill="#dce8e1">WT DRUM</text>
    <text x="110" y="5.5" fill="#dce8e1">2/4</text>
    <rect x="0" y="8" width="128" height="1" fill="#dce8e1"/>
    <text x="3" y="16.5" fill="#dce8e1">MODL</text>
    <text x="3" y="27.5" fill="#dce8e1">KICK</text>
    <text x="35" y="16.5" fill="#dce8e1">TUNE</text>
    <text x="35" y="27.5" fill="#dce8e1">48</text>
    <text x="67" y="16.5" fill="#dce8e1">DEC</text>
    <text x="67" y="27.5" fill="#dce8e1">600ms</text>
    <text x="99" y="16.5" fill="#dce8e1">WT A</text>
    <text x="99" y="27.5" fill="#dce8e1">PUNCH</text>
    <text x="3" y="40.5" fill="#dce8e1">WT B</text>
    <text x="3" y="51.5" fill="#dce8e1">BUZZ</text>
    <text x="35" y="40.5" fill="#dce8e1">MIX</text>
    <text x="35" y="51.5" fill="#dce8e1">18%</text>
    <text x="67" y="40.5" fill="#dce8e1">SCAN</text>
    <text x="67" y="51.5" fill="#dce8e1">55%</text>
    <text x="99" y="40.5" fill="#dce8e1">HIT</text>
    <text x="99" y="51.5" fill="#dce8e1">80%</text>
    <text x="1" y="62.5" fill="#dce8e1">READY</text>
  </g>
  <rect x="0.25" y="0.25" width="127.5" height="63.5" fill="none" stroke="#5b6661" stroke-width="0.5"/>
</svg>
