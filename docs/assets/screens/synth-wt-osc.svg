<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 128 64" role="img" aria-labelledby="title desc">
  <title id="title">Wavetable frame positions oscillator blend modulation noise and tone</title>
  <desc id="desc">Wavetable frame positions oscillator blend modulation noise and tone shown as it appears on Ableton Move.</desc>
  <rect width="128" height="64" fill="#050706"/>
  <g shape-rendering="crispEdges" font-family="DejaVu Sans Mono, IBM Plex Mono, monospace" font-size="6" font-style="normal" font-weight="400" text-rendering="geometricPrecision">
    <text x="1" y="5.5" fill="#dce8e1">WT OSC</text>
    <text x="110" y="5.5" fill="#dce8e1">3/4</text>
    <rect x="0" y="8" width="128" height="1" fill="#dce8e1"/>
    <text x="3" y="16.5" fill="#dce8e1">POSA</text>
    <text x="3" y="27.5" fill="#dce8e1">10%</text>
    <text x="35" y="16.5" fill="#dce8e1">POSB</text>
    <text x="35" y="27.5" fill="#dce8e1">35%</text>
    <text x="67" y="16.5" fill="#dce8e1">RATI</text>
    <text x="67" y="27.5" fill="#dce8e1">2</text>
    <text x="99" y="16.5" fill="#dce8e1">PM</text>
    <text x="99" y="27.5" fill="#dce8e1">0.18</text>
    <text x="3" y="40.5" fill="#dce8e1">DETN</text>
    <text x="3" y="51.5" fill="#dce8e1">0.0c</text>
    <text x="35" y="40.5" fill="#dce8e1">SUB</text>
    <text x="35" y="51.5" fill="#dce8e1">35%</text>
    <text x="67" y="40.5" fill="#dce8e1">NOIS</text>
    <text x="67" y="51.5" fill="#dce8e1">3%</text>
    <text x="99" y="40.5" fill="#dce8e1">TONE</text>
    <text x="99" y="51.5" fill="#dce8e1">85%</text>
    <text x="1" y="62.5" fill="#dce8e1">READY</text>
  </g>
  <rect x="0.25" y="0.25" width="127.5" height="63.5" fill="none" stroke="#5b6661" stroke-width="0.5"/>
