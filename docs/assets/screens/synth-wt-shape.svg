<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 128 64" role="img" aria-labelledby="title desc">
  <title id="title">Wavetable drum envelope drive compression and edge controls</title>
  <desc id="desc">Wavetable drum envelope drive compression and edge controls shown as it appears on Ableton Move.</desc>
  <rect width="128" height="64" fill="#050706"/>
  <g shape-rendering="crispEdges" font-family="DejaVu Sans Mono, IBM Plex Mono, monospace" font-size="6" font-style="normal" font-weight="400" text-rendering="geometricPrecision">
    <text x="1" y="5.5" fill="#dce8e1">WT SHAPE</text>
    <text x="110" y="5.5" fill="#dce8e1">4/4</text>
    <rect x="0" y="8" width="128" height="1" fill="#dce8e1"/>
    <text x="3" y="16.5" fill="#dce8e1">BEND</text>
    <text x="3" y="27.5" fill="#dce8e1">32.0</text>
    <text x="35" y="16.5" fill="#dce8e1">PDEC</text>
    <text x="35" y="27.5" fill="#dce8e1">22ms</text>
    <text x="67" y="16.5" fill="#dce8e1">SDEC</text>
    <text x="67" y="27.5" fill="#dce8e1">38ms</text>
    <text x="99" y="16.5" fill="#dce8e1">NDEC</text>
    <text x="99" y="27.5" fill="#dce8e1">18ms</text>
    <text x="3" y="40.5" fill="#dce8e1">COLR</text>
    <text x="3" y="51.5" fill="#dce8e1">HP</text>
    <text x="35" y="40.5" fill="#dce8e1">DRIV</text>
    <text x="35" y="51.5" fill="#dce8e1">30%</text>
    <text x="67" y="40.5" fill="#dce8e1">COMP</text>
    <text x="67" y="51.5" fill="#dce8e1">45%</text>
    <text x="99" y="40.5" fill="#dce8e1">EDGE</text>
    <text x="99" y="51.5" fill="#dce8e1">.15ms</text>
    <text x="1" y="62.5" fill="#dce8e1">READY</text>
  </g>
  <rect x="0.25" y="0.25" width="127.5" height="63.5" fill="none" stroke="#5b6661" stroke-width="0.5"/>
</svg>
